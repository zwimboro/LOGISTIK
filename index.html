<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pro-Diet List">
    <meta name="theme-color" content="#0d1117">
    
    <title>Pro-Diet OS | Список покупок</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #39d353;
            --danger: #f85149;
            --border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); padding-bottom: 120px; }
        
        header { background: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        h1 { font-size: 18px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin: 0; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.2s; padding: 5px; border-radius: 6px; }
        .icon-btn:active { transform: scale(0.9); background: var(--surface-hover); }
        .icon-btn:hover { color: var(--accent); }
        
        .search-container { background: var(--surface); padding: 10px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 60px; z-index: 9; }
        .search-container input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 15px; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 5px rgba(88, 166, 255, 0.2); }

        body.filter-active .item-row:not(.has-value) { display: none !important; }
        body.filter-active #filter-btn { color: var(--success); text-shadow: 0 0 10px rgba(57, 211, 83, 0.4); }
        
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        .category-group { margin-bottom: 20px; }
        .category-title { font-size: 14px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .category-arrow { transition: transform 0.3s ease; font-size: 12px; color: var(--text-muted); }
        .category-group.collapsed .category-arrow { transform: rotate(-90deg); }
        .category-items { transition: max-height 0.3s ease-out; overflow: hidden; }
        .category-group.collapsed .category-items { display: none; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 10px 15px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--border); transition: 0.2s; }
        .item-info { flex: 1; cursor: pointer; padding-right: 10px; }
        .item-name { font-size: 15px; font-weight: 500; transition: 0.2s; user-select: none; line-height: 1.2; }
        
        .item-row.has-value { border-color: rgba(57, 211, 83, 0.4); background: rgba(57, 211, 83, 0.08); }
        .item-row.has-value .item-name { color: var(--success); }
        
        .item-input-wrapper { display: flex; align-items: center; gap: 4px; }
        .stepper-btn { background: var(--surface-hover); border: 1px solid var(--border); color: var(--text); border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; user-select: none; transition: 0.1s; flex-shrink: 0;}
        .stepper-btn:active { transform: scale(0.9); background: var(--border); }
        input.qty-input { background: var(--bg); border: 1px solid var(--border); color: var(--accent); font-weight: bold; padding: 0; height: 32px; border-radius: 6px; width: 50px; text-align: center; font-size: 16px; margin: 0; flex-shrink: 0;}
        input.qty-input:focus { outline: none; border-color: var(--accent); }
        .unit { font-size: 11px; color: var(--text-muted); width: 45px; text-align: left; line-height: 1.1; flex-shrink: 0;}

        .floating-action { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; z-index: 100; display: flex; gap: 10px; }
        .btn-primary { background: var(--success); color: var(--bg); border: none; padding: 16px; flex: 1; border-radius: 12px; font-size: 16px; font-weight: bold; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(57, 211, 83, 0.3); transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-reset { background: var(--surface); color: var(--danger); border: 1px solid var(--border); width: 55px; flex-shrink: 0; border-radius: 12px; font-size: 18px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn-primary:active, .btn-reset:active { transform: scale(0.95); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s; }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); width: 90%; max-width: 400px; transform: scale(0.95); transition: transform 0.2s; max-height: 80vh; overflow-y: auto; }
        .modal.active .modal-content { transform: scale(1); }
        .modal-content h2 { margin-bottom: 15px; font-size: 18px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-size: 14px;}
        .btn-save { background: var(--accent); color: var(--bg); border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px;}
        .close-modal { color: var(--text-muted); cursor: pointer; font-size: 20px; padding: 5px; }

        .preset-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border); }
        .preset-name { font-weight: 500; font-size: 14px; }
        .preset-actions { display: flex; gap: 8px; }
        .btn-load { background: var(--success); color: var(--bg); border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-del { background: var(--surface-hover); color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }

        .toast { position: fixed; top: -60px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid var(--border); transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 9999; text-align: center; white-space: nowrap; }
        .toast.show { top: 20px; }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <header>
        <h1>Pro-Diet OS</h1>
        <div class="header-actions">
            <button class="icon-btn" id="filter-btn" onclick="toggleFilter()" title="Только выбранное">🛒</button>
            <button class="icon-btn" onclick="openPresets()" title="Шаблоны">📁</button>
            <button class="icon-btn" onclick="shareCart()" title="Поделиться">📤</button>
            <button class="icon-btn" onclick="toggleSettings()" title="Настройки API">⚙️</button>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 Быстрый поиск товара..." oninput="handleSearch(this.value)">
    </div>

    <div class="container" id="matrix-container"></div>

    <div class="floating-action">
        <button class="btn-reset" onclick="clearCart()" title="Очистить корзину">🗑️</button>
        <button class="btn-primary" id="btn-send" onclick="generateAndSend()">
            <span id="btn-label">🚀 Отправить (0)</span>
        </button>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2><span>Настройки API</span> <span class="close-modal" onclick="toggleSettings()">✕</span></h2>
            <div class="form-group">
                <label>Bot Token (@BotFather)</label>
                <input type="text" id="tg-token" placeholder="Токен бота" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Ваш Chat ID (@userinfobot)</label>
                <input type="text" id="tg-chat-id" placeholder="ID чата" autocomplete="off">
            </div>
            <button class="btn-save" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>

    <div class="modal" id="presets-modal">
        <div class="modal-content">
            <h2><span>Шаблоны</span> <span class="close-modal" onclick="closePresets()">✕</span></h2>
            
            <div class="form-group" style="display: flex; gap: 8px; margin-bottom: 20px;">
                <input type="text" id="preset-name" placeholder="Имя нового шаблона..." style="flex: 1;">
                <button class="btn-save" style="width: auto; margin: 0; padding: 0 15px;" onclick="savePreset()">💾</button>
            </div>
            
            <div id="presets-list"></div>
        </div>
    </div>

    <script>
        const DB = [
            { cat: "1. Фреш-Зона", icon: "🥦", items: [
                { id: "bananas", name: "Бананы", unit: "шт" },
                { id: "tomatoes", name: "Помидоры", unit: "шт" }
            ]},
            { cat: "2. Бакалея", icon: "🌾", items: [
                { id: "oats", name: "Овсянка", unit: "г/кг/уп" },
                { id: "chia", name: "Семена Чиа", unit: "уп" },
                { id: "rice", name: "Рис Басмати", unit: "г" },
                { id: "pasta", name: "Спагетти", unit: "г" },
                { id: "buckwheat", name: "Гречка", unit: "г/кг" },
                { id: "bread", name: "Протеиновый хлеб", unit: "уп" },
                { id: "nuts", name: "Орехи (Грецкие)", unit: "г" },
                { id: "oil", name: "Масло растит.", unit: "мл" },
                { id: "cacao", name: "Какао", unit: "г" }
            ]},
            { cat: "3. Сыры, Ягоды, Снеки", icon: "🧀", items: [
                { id: "honey", name: "Мёд", unit: "г" },
                { id: "white_cheese", name: "Белый сыр (Брынза)", unit: "г" },
                { id: "kashar", name: "Сыр Кашар", unit: "г" },
                { id: "gouda", name: "Сыр Гауда", unit: "уп/г" },
                { id: "cottage", name: "Творожный сыр (Филадельфия)", unit: "уп" },
                { id: "olives", name: "Оливки", unit: "уп" },
                { id: "blueberry", name: "Черника", unit: "г" },
                { id: "raspberry", name: "Малина", unit: "г" },
                { id: "chips", name: "Чипсы", unit: "уп" }
            ]},
            { cat: "4. Мясной отдел", icon: "🥩", items: [
                { id: "chicken", name: "Филе курицы", unit: "кг" },
                { id: "fuet", name: "Салями Fuet", unit: "шт" }
            ]},
            { cat: "5. Молочная база", icon: "🥛", items: [
                { id: "milk", name: "Молоко 1.5%", unit: "уп" },
                { id: "eggs", name: "Яйца", unit: "шт" },
                { id: "butter", name: "Сливочное масло", unit: "уп/г" }
            ]},
            { cat: "6. Инфраструктура & Зоопарк", icon: "🧻", items: [
                { id: "rat_food", name: "Корм для крыс", unit: "уп" },
                { id: "tp", name: "Туалетная бумага", unit: "рул" },
                { id: "towels", name: "Бум. полотенца", unit: "рул" }
            ]},
            { cat: "7. Напитки и Спортпит", icon: "🍺", items: [
                { id: "juice", name: "Сок", unit: "уп/шт" },
                { id: "beer", name: "Пиво", unit: "шт" },
                { id: "protein", name: "Протеин", unit: "уп" },
                { id: "creatine", name: "Креатин", unit: "г" }
            ]},
            { cat: "8. Чайная зона", icon: "☕", items: [
                { id: "sencha", name: "Чай Сенча", unit: "г/уп" },
                { id: "jasmine", name: "Чай Жасминовый", unit: "г/уп" },
                { id: "chamomile", name: "Ромашка", unit: "уп" },
                { id: "fennel", name: "Фенхель Анис Тмин", unit: "уп" },
                { id: "tea_bags_m", name: "Чайные пакетики M", unit: "уп/шт" },
                { id: "tea_bags_xl", name: "Чайные пакетики XL", unit: "уп/шт" }
            ]},
            { cat: "9. Бытовая химия и Гигиена", icon: "🧹", items: [
                { id: "apple_soap", name: "Яблочное моющее", unit: "мл" },
                { id: "dw_pods", name: "Капсулы в посудомойку", unit: "уп/шт" },
                { id: "laundry_pods", name: "Капсулы в стиралку", unit: "уп/шт" },
                { id: "wet_wipes", name: "Влажные салфетки", unit: "уп" },
                { id: "alcohol_wipes", name: "Спиртовые салфетки", unit: "уп" },
                { id: "hand_soap", name: "Мыло для рук", unit: "мл/шт" },
                { id: "sponge", name: "Мочалки", unit: "шт" },
                { id: "shower_gel", name: "Гель для душа", unit: "мл" },
                { id: "shave_gel", name: "Гель для бритья", unit: "мл" },
                { id: "razors", name: "Бритвы", unit: "шт" }
            ]}
        ];

        let cartState = {};
        let presetsState = {};
        let toastTimeout;

        window.onload = function() {
            cartState = JSON.parse(localStorage.getItem('proDietCart')) || {};
            presetsState = JSON.parse(localStorage.getItem('proDietPresets')) || {};
            renderMatrix();
            loadSettings();
            updateCounter();
        };

        function doVibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.borderColor = type === 'error' ? 'var(--danger)' : 'var(--success)';
            toast.classList.add('show');
            doVibrate(type === 'error' ? [50, 50, 50] : 50);

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function toggleFilter() {
            document.body.classList.toggle('filter-active');
            doVibrate(20);
            if (document.body.classList.contains('filter-active')) {
                document.querySelectorAll('.category-group').forEach(group => {
                    if (group.querySelector('.item-row.has-value')) group.classList.remove('collapsed');
                });
            }
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderMatrix() {
            const container = document.getElementById('matrix-container');
            let fullHtml = ''; 

            DB.forEach(category => {
                fullHtml += `
                    <div class="category-group" id="cat-group-${category.cat}">
                        <div class="category-title" onclick="toggleCategory(this)">
                            <span>${category.icon} ${category.cat}</span>
                            <span class="category-arrow">▼</span>
                        </div>
                        <div class="category-items">
                `;
                
                category.items.forEach(item => {
                    let val = cartState[item.id] !== undefined ? cartState[item.id] : '';
                    let hasValue = (val !== '' && parseFloat(val) > 0) ? 'has-value' : ''; 

                    fullHtml += `
                        <div class="item-row ${hasValue}" id="row-${item.id}">
                            <div class="item-info" onclick="focusInput('${item.id}')">
                                <span class="item-name">${item.name}</span>
                            </div>
                            <div class="item-input-wrapper">
                                <div class="stepper-btn" onclick="stepValue('${item.id}', -1)">-</div>
                                <input type="text" 
                                       inputmode="decimal"
                                       class="qty-input"
                                       id="qty-${item.id}" 
                                       value="${val}" 
                                       placeholder="0" 
                                       onfocus="this.select()"
                                       oninput="handleInput('${item.id}', this)">
                                <div class="stepper-btn" onclick="stepValue('${item.id}', 1)">+</div>
                                <span class="unit">${item.unit}</span>
                            </div>
                        </div>
                    `;
                });
                
                fullHtml += `</div></div>`;
            });

            container.innerHTML = fullHtml;
        }

        function toggleCategory(element) {
            element.parentElement.classList.toggle('collapsed');
            doVibrate(10);
        }

        function focusInput(id) {
            document.getElementById('qty-' + id).focus();
        }

        function handleSearch(query) {
            query = query.toLowerCase().trim();
            document.querySelectorAll('.category-group').forEach(group => {
                let hasMatch = false;
                group.querySelectorAll('.item-row').forEach(row => {
                    let name = row.querySelector('.item-name').innerText.toLowerCase();
                    if (name.includes(query)) {
                        row.style.display = 'flex';
                        hasMatch = true;
                    } else {
                        row.style.display = 'none';
                    }
                });
                
                if (hasMatch || query === '') {
                    group.style.display = 'block';
                    if (query !== '') group.classList.remove('collapsed');
                } else {
                    group.style.display = 'none';
                }
            });
        }

        function stepValue(id, step) {
            let input = document.getElementById('qty-' + id);
            let current = parseFloat(input.value.replace(',', '.')) || 0;
            let newVal = current + step;
            if (newVal < 0) newVal = 0;
            
            if (!Number.isInteger(newVal)) newVal = parseFloat(newVal.toFixed(2));
            
            input.value = newVal === 0 ? '' : newVal;
            handleInput(id, input);
            doVibrate(15);
        }

        function handleInput(id, input) {
            let rawValue = input.value.replace(/[^0-9.,]/g, '');
            let sanitized = rawValue.replace(',', '.');
            
            let parts = sanitized.split('.');
            if (parts.length > 2) sanitized = parts[0] + '.' + parts.slice(1).join('');

            if (input.value !== sanitized) input.value = sanitized;

            let parsed = parseFloat(sanitized);

            if (sanitized === "" || isNaN(parsed) || parsed <= 0) {
                delete cartState[id];
                document.getElementById('row-' + id).classList.remove('has-value');
            } else {
                cartState[id] = sanitized;
                document.getElementById('row-' + id).classList.add('has-value');
            }
            
            localStorage.setItem('proDietCart', JSON.stringify(cartState));
            updateCounter();
        }

        function updateCounter() {
            const count = Object.keys(cartState).length;
            const label = document.getElementById('btn-label');
            label.innerText = count > 0 ? `🚀 Отправить (${count})` : "🚀 Отправить (0)";
        }

        function clearCart() {
            if (Object.keys(cartState).length === 0) {
                showToast("Корзина уже пуста", "info");
                return;
            }
            if (confirm("Точно очистить весь список?")) {
                cartState = {};
                localStorage.removeItem('proDietCart');
                document.querySelectorAll('input.qty-input').forEach(input => input.value = '');
                document.querySelectorAll('.item-row').forEach(row => row.classList.remove('has-value'));
                updateCounter();
                showToast("Корзина очищена", "info");
            }
        }

        function openPresets() {
            document.getElementById('presets-modal').classList.add('active');
            renderPresetsList();
            doVibrate(20);
        }

        function closePresets() {
            document.getElementById('presets-modal').classList.remove('active');
        }

        function savePreset() {
            const nameInput = document.getElementById('preset-name');
            const name = nameInput.value.trim();
            
            if (!name) return showToast("Введите имя шаблона", "error");
            if (Object.keys(cartState).length === 0) return showToast("Нельзя сохранить пустой список", "error");

            presetsState[name] = JSON.parse(JSON.stringify(cartState));
            localStorage.setItem('proDietPresets', JSON.stringify(presetsState));
            
            nameInput.value = '';
            showToast("Шаблон сохранен", "info");
            renderPresetsList();
        }

        function renderPresetsList() {
            const list = document.getElementById('presets-list');
            list.innerHTML = '';
            
            for (let name in presetsState) {
                list.innerHTML += `
                    <div class="preset-row">
                        <span class="preset-name">${escapeHtml(name)}</span>
                        <div class="preset-actions">
                            <button class="btn-load" onclick="loadPreset('${escapeHtml(name)}')">Загрузить</button>
                            <button class="btn-del" onclick="deletePreset('${escapeHtml(name)}')">✕</button>
                        </div>
                    </div>
                `;
            }
            if (list.innerHTML === '') {
                list.innerHTML = '<div style="text-align:center; color: var(--text-muted); font-size: 12px; margin-top: 10px;">Нет сохраненных шаблонов</div>';
            }
        }

        function loadPreset(name) {
            if (!presetsState[name]) return;
            cartState = JSON.parse(JSON.stringify(presetsState[name]));
            localStorage.setItem('proDietCart', JSON.stringify(cartState));
            renderMatrix();
            updateCounter();
            closePresets();
            showToast(`Шаблон «${name}» загружен`, "info");
        }

        function deletePreset(name) {
            if (confirm(`Удалить шаблон «${name}»?`)) {
                delete presetsState[name];
                localStorage.setItem('proDietPresets', JSON.stringify(presetsState));
                renderPresetsList();
            }
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('active');
            doVibrate(20);
        }

        function loadSettings() {
            document.getElementById('tg-token').value = localStorage.getItem('tg_token') || '';
            document.getElementById('tg-chat-id').value = localStorage.getItem('tg_chat_id') || '';
        }

        function saveSettings() {
            localStorage.setItem('tg_token', document.getElementById('tg-token').value.trim());
            localStorage.setItem('tg_chat_id', document.getElementById('tg-chat-id').value.trim());
            toggleSettings();
            showToast("Настройки API сохранены", "info");
        }

        function generateMessageText() {
            let message = "🛒 *СПИСОК ПОКУПОК*\n\n";
            let hasItems = false;

            DB.forEach(category => {
                let catText = "";
                category.items.forEach(item => {
                    let val = cartState[item.id];
                    let qty = parseFloat(val);
                    if (val && !isNaN(qty) && qty > 0) {
                        catText += `▫️ ${item.name}: ${val} ${item.unit}\n`;
                        hasItems = true;
                    }
                });
                if (catText !== "") message += `*${category.icon} ${category.cat}*\n${catText}\n`;
            });
            return hasItems ? message : null;
        }

        async function shareCart() {
            doVibrate(20);
            let message = generateMessageText();
            if (!message) return showToast("Список пуст", "error");

            if (navigator.share) {
                try {
                    await navigator.share({ title: 'Список покупок Pro-Diet', text: message });
                } catch (err) { console.log("Шаринг отменен"); }
            } else {
                await navigator.clipboard.writeText(message);
                showToast("Текст скопирован в буфер!", "info");
            }
        }

        async function generateAndSend() {
            doVibrate(30);
            const token = localStorage.getItem('tg_token');
            const chatId = localStorage.getItem('tg_chat_id');
            const btn = document.getElementById('btn-send');
            const label = document.getElementById('btn-label');

            if (!token || !chatId) {
                showToast("Укажи Token и Chat ID ⚙️", "error");
                toggleSettings();
                return;
            }

            let message = generateMessageText();
            if (!message) return showToast("Список пуст!", "error");

            let htmlMessage = message.replace(/\*(.*?)\*/g, '<b>$1</b>');

            label.innerText = "⏳...";
            btn.style.opacity = "0.7";

            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: htmlMessage, parse_mode: 'HTML' })
                });
                
                const result = await response.json();
                if (result.ok) {
                    label.innerText = "✅ Отправлено";
                    btn.style.background = "#2ea043";
                    showToast("Успешно отправлено!", "info");
                    
                    cartState = {};
                    localStorage.removeItem('proDietCart');
                    renderMatrix();
                    updateCounter();

                } else {
                    showToast("Ошибка API: " + result.description, "error");
                    label.innerText = "❌ Ошибка";
                    btn.style.background = "var(--danger)";
                }
            } catch (error) {
                showToast("Ошибка сети", "error");
                label.innerText = "❌ Сеть";
                btn.style.background = "var(--danger)";
            }

            setTimeout(() => {
                btn.style.background = "var(--success)";
                btn.style.opacity = "1";
                updateCounter();
            }, 2500);
        }
    </script>
</body>
