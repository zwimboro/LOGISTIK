<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#0d1117">
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiUHJvLURpZXQgT1MiLCJzaG9ydF9uYW1lIjoiUHJvLURpZXQiLCJzdGFydF91cmwiOiIuLyIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwZDExMTciLCJ0aGVtZV9jb2xvciI6IiMwZDExMTcifQ==">
    <link rel="apple-touch-icon" href="icon.png"> 
    
    <title>Pro-Diet OS | Список покупок</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg: #0d1117;
            --surface: rgba(22, 27, 34, 0.75);
            --surface-solid: #161b22;
            --surface-hover: #21262d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #39d353;
            --danger: #f85149;
            --border: #30363d;
            --glow: rgba(88, 166, 255, 0.15);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body { 
            background-color: var(--bg); 
            scroll-behavior: smooth; 
            overscroll-behavior-y: none;
        }
        
        body { 
            background-color: transparent; 
            color: var(--text); 
            padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px)); 
            overflow-x: hidden;
            position: relative;
            z-index: 1;
        }

        html.modal-open, body.modal-open {
            overflow: hidden;
            height: 100%;
        }

        .ambient-glow {
            position: fixed;
            top: -20%; left: -20%; width: 140%; height: 140%;
            background: radial-gradient(circle at 50% 30%, var(--glow) 0%, transparent 60%);
            z-index: -1;
            transition: background 0.8s ease;
            pointer-events: none;
            will-change: background;
        }
        
        header { 
            background: rgba(22, 27, 34, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: calc(15px + env(safe-area-inset-top, 0px)) 20px 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; 
        }
        h1 { font-size: 18px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        
        .icon-btn, .stepper-btn, .chip, .category-title, .btn-primary, .btn-reset, .btn-save, .close-modal, .btn-load, .btn-del, .jump-icon {
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
        }
        
        .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.2s; padding: 5px; border-radius: 6px; }
        .icon-btn:active { transform: scale(0.9); background: var(--surface-hover); }
        .icon-btn:hover { color: var(--accent); }
        
        body.filter-active .item-row:not(.has-value):not(.is-focused) { display: none !important; }
        #filter-btn.active { color: var(--success); text-shadow: 0 0 10px rgba(57, 211, 83, 0.4); }

        .smart-dashboard { padding: 10px 15px; border-bottom: 1px solid var(--border); background: var(--bg); }
        .dashboard-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.5px; user-select: none; -webkit-user-select: none; }
        .chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .chip-scroll::-webkit-scrollbar { display: none; }
        .chip { background: var(--surface-solid); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .combo-btn { background: rgba(57, 211, 83, 0.15); color: var(--success); border: 1px solid rgba(57, 211, 83, 0.3); }
        .combo-btn:active { transform: scale(0.95); }
        .combo-add-btn { border: 1px dashed var(--text-muted); color: var(--text-muted); background: transparent; }
        
        .container { padding: 15px; max-width: 600px; margin: 0 auto; padding-right: 35px; } 
        
        .jump-sidebar { position: fixed; right: 2px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 40; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); padding: 10px 5px; border-radius: 20px; border: 1px solid var(--border); }
        .jump-icon { font-size: 16px; opacity: 0.6; cursor: pointer; transition: 0.2s; text-align: center; }
        .jump-icon:active { transform: scale(1.3); opacity: 1; }
        
        .category-group { margin-bottom: 20px; transition: opacity 0.3s; }
        
        .category-title { 
            font-size: 14px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; 
            padding: 10px 5px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer; 
            position: sticky; top: calc(55px + env(safe-area-inset-top, 0px)); z-index: 30;
            background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 0 0 8px 8px;
        }
        
        .category-arrow { transition: transform 0.3s ease; font-size: 12px; color: var(--text-muted); }
        .category-group.collapsed .category-arrow { transform: rotate(-90deg); }
        .category-items { transition: max-height 0.3s ease-out; overflow: hidden; }
        .category-group.collapsed .category-items { display: none; }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .item-row { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--surface-solid); padding: 10px 15px; margin-bottom: 8px; 
            border-radius: 12px; border: 1px solid var(--border); transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: fadeUp 0.3s ease-out forwards; opacity: 0;
        }
        .item-info { flex: 1; cursor: pointer; padding-right: 10px; min-width: 0; touch-action: manipulation; }
        .item-name { font-size: 15px; font-weight: 500; transition: 0.2s; user-select: none; -webkit-user-select: none; line-height: 1.2; display: block; word-break: break-word; overflow-wrap: anywhere; }
        .item-price { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
        
        .item-row.has-value { 
            border-color: rgba(57, 211, 83, 0.5); 
            background: rgba(22, 27, 34, 0.5);
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.6), inset -2px -2px 5px rgba(255,255,255,0.03);
        }
        .item-row.has-value .item-name { color: var(--success); text-shadow: 0 0 8px rgba(57, 211, 83, 0.3); }
        
        .item-input-wrapper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .stepper-btn { background: var(--surface-hover); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.1s; flex-shrink: 0;}
        .stepper-btn:active { transform: scale(0.9); background: var(--border); }
        
        input.qty-input { 
            background: var(--bg); border: 1px solid var(--border); color: var(--accent); 
            font-weight: bold; padding: 0; height: 34px; border-radius: 8px; width: 50px; 
            text-align: center; font-size: 16px; margin: 0; flex-shrink: 0;
            font-variant-numeric: tabular-nums; 
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
        }
        input.qty-input:focus { outline: none; border-color: var(--accent); }
        .unit { font-size: 11px; color: var(--text-muted); width: 45px; text-align: left; line-height: 1.1; flex-shrink: 0; user-select: none; -webkit-user-select: none; }

        body.keyboard-open .floating-action { opacity: 0; pointer-events: none; transform: translate(-50%, 40px); }
        body.keyboard-open .floating-search-wrapper { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }

        .floating-search-wrapper {
            position: fixed; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); right: 20px; z-index: 99;
            display: flex; justify-content: flex-end; align-items: center;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .floating-search-input {
            width: 0; opacity: 0; background: var(--surface-solid); border: 1px solid var(--accent); color: var(--text); padding: 12px 15px; border-radius: 30px; 
            font-size: 16px; 
            outline: none; transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s; pointer-events: none;
            margin-right: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 65vw;
        }
        .floating-search-input.active { width: 250px; opacity: 1; pointer-events: auto; }
        .floating-search-btn {
            width: 50px; height: 50px; border-radius: 25px; background: var(--accent); color: var(--bg); border: none; font-size: 20px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(88, 166, 255, 0.4); cursor: pointer; transition: 0.2s; 
        }
        .floating-search-btn:active { transform: scale(0.9); }

        .floating-action { 
            position: fixed; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; z-index: 100; 
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            display: flex; gap: 10px; padding: 10px; border-radius: 20px;
            background: rgba(33, 38, 45, 0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-primary { 
            background: var(--success); color: var(--bg); border: none; padding: 12px; flex: 1; border-radius: 14px; 
            font-size: 15px; font-weight: bold; text-transform: uppercase; cursor: pointer; 
            transition: 0.2s; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
            position: relative; overflow: hidden;
        }
        .btn-primary .total-price { font-size: 12px; opacity: 0.9; font-variant-numeric: tabular-nums; }
        
        .btn-primary::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg) translateY(-100%); transition: 0s;
        }
        .btn-primary.loading::after { transform: rotate(30deg) translateY(100%); transition: 1s ease-in-out; }
        
        .btn-reset { background: rgba(248, 81, 73, 0.1); color: var(--danger); border: 1px solid rgba(248, 81, 73, 0.3); width: 55px; flex-shrink: 0; border-radius: 14px; font-size: 18px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn-primary:active, .btn-reset:active { transform: scale(0.95); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { background: var(--surface-solid); padding: 20px; border-radius: 16px; border: 1px solid var(--border); width: 90%; max-width: 400px; transform: scale(0.95); transition: transform 0.2s; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal.active .modal-content { transform: scale(1); }
        .modal-content h2 { margin-bottom: 15px; font-size: 18px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-size: 16px; font-variant-numeric: tabular-nums; outline: none; } 
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
        .btn-save { background: var(--accent); color: var(--bg); border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .close-modal { color: var(--text-muted); cursor: pointer; font-size: 20px; padding: 5px; }

        .preset-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
        .preset-name { font-weight: 500; font-size: 14px; word-break: break-word; overflow-wrap: anywhere; }
        .preset-actions { display: flex; gap: 8px; }
        .btn-load { background: var(--success); color: var(--bg); border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-del { background: rgba(248, 81, 73, 0.1); color: var(--danger); border: 1px solid rgba(248, 81, 73, 0.3); padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

        .toast-container { position: fixed; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; display: flex; justify-content: center; top: calc(15px + env(safe-area-inset-top, 0px)); }
        .toast { 
            background: #000; color: #fff; padding: 0 0; border-radius: 30px; font-size: 14px; font-weight: 500; 
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            width: 0px; height: 0px; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 20px rgba(0,0,0,0.6); gap: 8px; border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show { width: auto; height: 40px; padding: 0 20px; opacity: 1; }
        .toast-btn { pointer-events: auto; background: var(--accent); color: #000; border: none; border-radius: 12px; padding: 4px 10px; font-size: 12px; font-weight: bold; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="toast-container">
        <div id="toast" class="toast">
            <span id="toast-msg"></span>
            <button id="toast-action" class="toast-btn" style="display:none;" onclick="undoAction()">Отменить</button>
        </div>
    </div>

    <header id="main-header">
        <h1>Pro-Diet OS</h1>
        <div class="header-actions">
            <button class="icon-btn" id="filter-btn" onclick="toggleFilter()" title="Только выбранное">🛒</button>
            <button class="icon-btn" onclick="openDbManager()" title="База Товаров">📦</button>
            <button class="icon-btn" onclick="openPresets()" title="Шаблоны">📁</button>
            <button class="icon-btn" onclick="shareCart()" title="Поделиться">📤</button>
            <button class="icon-btn" onclick="toggleSettings()" title="Настройки API">⚙️</button>
        </div>
    </header>

    <div class="smart-dashboard">
        <div class="dashboard-title">Быстрые сборки (Удерживай для удаления)</div>
        <div class="chip-scroll" id="combos-container"></div>
        <div class="dashboard-title" style="margin-top: 10px;">Фильтры тегов</div>
        <div class="chip-scroll" id="tag-container">
            <div class="chip active" onclick="toggleTag('', this)">Все</div>
            <div class="chip" onclick="toggleTag('углеводы', this)">Углеводы</div>
            <div class="chip" onclick="toggleTag('белок', this)">Белок</div>
            <div class="chip" onclick="toggleTag('химия', this)">Химия</div>
        </div>
    </div>

    <div class="container" id="matrix-container"></div>

    <div class="jump-sidebar" id="jump-sidebar"></div>

    <div class="floating-search-wrapper">
        <input type="text" class="floating-search-input" id="search-input" placeholder="Поиск (в т.ч. синонимы)..." oninput="debouncedSearch(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeypress="if(event.key === 'Enter') this.blur();">
        <button class="floating-search-btn" onclick="toggleSearch()" id="search-toggle-btn">🔍</button>
    </div>

    <div class="floating-action">
        <button class="btn-reset" onclick="clearCart()" title="Очистить корзину">🗑️</button>
        <button class="btn-primary" id="btn-send" onclick="generateAndSend()">
            <span id="btn-label">🚀 Отправить (0)</span>
            <span class="total-price" id="btn-total">Итог: 0.00 €</span>
        </button>
    </div>

    <div class="modal" id="settings-modal" onclick="if(event.target === this) toggleSettings()">
        <div class="modal-content">
            <h2><span>Настройки API</span> <span class="close-modal" onclick="toggleSettings()">✕</span></h2>
            <div class="form-group">
                <label>Bot Token (@BotFather)</label>
                <input type="text" id="tg-token" placeholder="Например: 123456:ABC-DEF" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeypress="if(event.key === 'Enter') { saveSettings(); }">
            </div>
            <div class="form-group">
                <label>Ваш Chat ID (@userinfobot)</label>
                <input type="text" id="tg-chat-id" placeholder="Например: 123456789" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeypress="if(event.key === 'Enter') { saveSettings(); }">
            </div>
            <button class="btn-save" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>

    <div class="modal" id="presets-modal" onclick="if(event.target === this) closePresets()">
        <div class="modal-content">
            <h2><span>Шаблоны (Заменяют корзину)</span> <span class="close-modal" onclick="closePresets()">✕</span></h2>
            <div class="form-group" style="display: flex; gap: 8px; margin-bottom: 20px;">
                <input type="text" id="preset-name" placeholder="Имя шаблона..." style="flex: 1;" maxlength="40" autocomplete="off" onkeypress="if(event.key === 'Enter') { savePreset(); this.blur(); }">
                <button class="btn-save" style="width: auto; margin: 0; padding: 0 15px;" onclick="savePreset()">💾</button>
            </div>
            <div id="presets-list"></div>
        </div>
    </div>

    <div class="modal" id="db-modal" onclick="if(event.target === this) closeDbManager()">
        <div class="modal-content">
            <h2><span>База товаров</span> <span class="close-modal" onclick="closeDbManager()">✕</span></h2>
            
            <div class="form-group">
                <label>Выберите категорию:</label>
                <select id="db-cat-select" onchange="renderDbItems()"></select>
            </div>
            
            <div id="db-items-list" style="max-height: 220px; overflow-y: auto; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; padding: 5px;"></div>

            <div style="border-top: 1px solid var(--border); padding-top: 15px;">
                <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--accent);" id="db-form-title">Добавить новый товар</h3>
                <input type="hidden" id="db-item-id">
                <div class="form-group">
                    <input type="text" id="db-item-name" placeholder="Название (напр. Булгур)" autocomplete="off" onkeypress="if(event.key === 'Enter') { saveDbItem(); }">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <input type="number" id="db-item-price" placeholder="Цена (€)" step="0.01" onkeypress="if(event.key === 'Enter') { saveDbItem(); }">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <select id="db-item-unit" onchange="togglePackSize()">
                            <option value="шт">шт</option>
                            <option value="г">г (Граммы)</option>
                            <option value="кг">кг</option>
                            <option value="уп">уп</option>
                            <option value="рул">рул</option>
                            <option value="мл">мл</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="db-packsize-group" style="display: none;">
                    <input type="number" id="db-item-packsize" placeholder="Вес 1 пачки в граммах (напр. 500)" onkeypress="if(event.key === 'Enter') { saveDbItem(); }">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-save" onclick="saveDbItem()" style="flex: 2;">Сохранить</button>
                    <button class="btn-reset" onclick="resetDbForm()" style="flex: 1; margin-top: 10px; width: auto; font-size: 14px;">Сброс</button>
                </div>
            </div>

            <div style="border-top: 1px solid var(--border); padding-top: 15px; margin-top: 15px;">
                <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--accent);">Сохранение базы</h3>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn-load" onclick="exportDbJson()" style="flex: 1; padding: 10px;">💾 Скачать JSON</button>
                    <button class="btn-load" onclick="document.getElementById('import-db-file').click()" style="flex: 1; background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); padding: 10px;">📂 Загрузить</button>
                    <input type="file" id="import-db-file" accept=".json" style="display: none;" onchange="importDbJson(event)">
                    <button class="btn-load" onclick="copyDbCode()" style="flex: 100%; margin-top: 5px; background: var(--surface-solid); color: var(--accent); border: 1px solid var(--accent); padding: 10px;">📋 Скопировать код БД</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APP_VERSION = 'v36';
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            const registerSW = () => {
                const cacheUrl = location.origin + location.pathname;
                const swCode = `
                    const CACHE_NAME = 'pro-diet-cache-${APP_VERSION}';
                    self.addEventListener('install', event => {
                        self.skipWaiting();

                            caches.keys().then(keys => Promise.all(
                                keys.map(key => {
                                    if (key !== CACHE_NAME) return caches.delete(key);
                                })
                            )).then(() => self.clients.claim())
                        );
                    });
                    self.addEventListener('fetch', event => {
                        // Строго игнорируем любые API запросы, браузер отработает их сам (без проблем с CORS)

                        event.respondWith(
                            fetch(event.request)

                                        const resClone = response.clone();
                                        caches.open(CACHE_NAME).then(cache => cache.put(event.request, resClone));
                                        return response;
                                    }
                                    return caches.match(event.request, { ignoreSearch: true }).then(cached => cached || response);
                                })
                                .catch(() => caches.match(event.request, { ignoreSearch: true }))
                        );

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        
        function escapeJs(text) {
            return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
        }

        function convertHtmlToPlain(htmlStr) {
            return htmlStr
                .replace(/<b>(.*?)<\/b>/g, '*$1*')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/&#039;/g, "'")
                .replace(/&amp;/g, '&');
        }

        function safeParse(key, fallback) {
            try { 
                const data = JSON.parse(localStorage.getItem(key)); 
                return (data !== null && data !== undefined) ? data : fallback;
            } catch(e) { return fallback; }
        }

        function safeStorageWrite(key, data) {
            try { 
                localStorage.setItem(key, JSON.stringify(data)); 
                return true;
            } catch (e) {
                showToast("Превышен лимит памяти!", "error");
                return false;
            }
        }

                    });
                }
            });
        }

        function sanitizeCart() {

            for (let key in cartState) {

                    delete cartState[key];
                    changed = true;
                }
            }
            if (changed) safeStorageWrite('proDietCart', cartState);
        }

            } else {
                DB = currentDb;

            buildItemMap();

            presetsState = safeParse('proDietPresets', {});

            msgObj.innerText = message;
            toast.style.borderColor = type === 'error' ? 'var(--danger)' : 'var(--success)';
            btn.style.display = allowUndo ? 'block' : 'none';
            
            toast.classList.add('show');
            doVibrate(type === 'error' ? [50, 50, 50] : 20);

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), allowUndo ? 5000 : 2500);

        function updateVisibility() {
            document.querySelectorAll('.category-group').forEach(group => {
                let hasVisible = false;
                group.querySelectorAll('.item-row').forEach(row => {
                    const id = row.id.replace('row-', '');
                    const name = row.querySelector('.item-name').innerText.toLowerCase();
                    const tags = row.getAttribute('data-tags');
                    let val = cartState[id] || '';
                    let hasValue = (val !== '' && parseFloat(val) > 0);
                    
                    let isFocused = document.activeElement && document.activeElement.id === ('qty-' + id);
                    
                    let matchSearch = true;
                    if (currentSearch) {
                        let itemData = itemMap[id];
                        matchSearch = name.includes(currentSearch);
                        if (!matchSearch && itemData && itemData.aliases) {
                            matchSearch = itemData.aliases.some(al => al.includes(currentSearch));
                        }
                    }

                    let matchTag = activeTag === '' || tags.includes(activeTag);
                    let matchCart = !isCartFilterActive || hasValue || isFocused; 

                    if (matchSearch && matchTag && matchCart) {
                        row.style.display = 'flex';
                        row.classList.add('is-focused');
                        hasVisible = true;
                    } else {
                        row.style.display = 'none';
                        row.classList.remove('is-focused');
                    }
                });

                group.style.display = hasVisible ? 'block' : 'none';
                if (currentSearch !== '' && hasVisible) {
                    group.classList.remove('collapsed');
                }

        function createCombo() {
            const ids = Object.keys(cartState);
            if(ids.length === 0) return showToast("Добавь товары в корзину!", "error");
            
            const name = prompt("Название для быстрой сборки (макс. 15 симв):");
            if(name && name.trim() !== '') {
                customCombos.push({ 
                    id: 'combo_' + Math.random().toString(36).substr(2, 9),
                    name: name.trim().slice(0,15), 
                    ids: ids 
                });
                safeStorageWrite('proDietCombos', customCombos);
                renderCombos();
                showToast("Сборка сохранена", "success");

        function deleteCombo(comboId) {
            if(isDeletingCombo) return;
            const idx = customCombos.findIndex(c => c.id === comboId);
            if (idx === -1) return;
            
            isDeletingCombo = true;
            if(confirm(`Удалить сборку "${customCombos[idx].name}"?`)) {
                customCombos.splice(idx, 1);
                safeStorageWrite('proDietCombos', customCombos);
                renderCombos();
                showToast("Удалено", "info");
            }
            setTimeout(() => { isDeletingCombo = false; }, 300);
        }

        function applyCombo(comboId) {
            if(isDeletingCombo) return;
            const combo = customCombos.find(c => c.id === comboId);
            if(!combo) return;
            
            historyState = JSON.parse(JSON.stringify(cartState));
            let added = false;
            
            combo.ids.forEach(id => {
                if(!cartState[id] || parseFloat(cartState[id]) === 0) {
                    let itemObj = itemMap[id];
                    if(itemObj) {
                        let qty = itemObj.unit === 'г' && itemObj.packSize ? itemObj.packSize : 1;
                        cartState[id] = qty.toString();
                        added = true;
                    }
                }
            });
            if(added) {
                if(!safeStorageWrite('proDietCart', cartState)) {
                    cartState = safeParse('proDietCart', {});
                }
                syncCartUI();
                showToast("Сборка добавлена!", "info", true);
            } else {
                showToast("Всё уже в корзине", "info");
            }
        }

                            <span class="category-arrow">▼</span>
                        </div>
                        <div class="category-items">
                `;
                
                if (category.items) {
                    category.items.forEach(item => {
                        let val = cartState[item.id] !== undefined ? cartState[item.id] : '';
                        let hasValue = (val !== '' && parseFloat(val) > 0) ? 'has-value' : ''; 
                        let animDelay = (itemIndex * 0.02) + 's';

        function stepValue(id, step) {
            let input = document.getElementById('qty-' + id);
            if(!input) return;
            let stepAmt = step;
            let item = itemMap[id];
            
            if(item) {
                if (item.unit === 'г' || item.unit === 'мл') {
                    stepAmt = item.packSize ? step * item.packSize : step * 100;
                }
            }

            let current = parseFloat(input.value.replace(/,/g, '.').replace(/[^0-9.]/g, '')) || 0;
            let newVal = current + stepAmt;
            if (newVal < 0) newVal = 0;
            if (!Number.isInteger(newVal)) newVal = parseFloat(newVal.toFixed(2));
            
            input.value = newVal === 0 ? '' : newVal;
            handleInput(id, input);
            doVibrate(15);
        }

        function handleInput(id, input) {
            let start = input.selectionStart;
            let sanitized = input.value.replace(/,/g, '.').replace(/[^0-9.]/g, '');
            
            if (sanitized.startsWith('.')) sanitized = '0' + sanitized;
            
            let parts = sanitized.split('.');
            if (parts.length > 2) sanitized = parts[0] + '.' + parts.slice(1).join('');
            
            if (input.value !== sanitized) {
                input.value = sanitized;
                try { input.setSelectionRange(start, start); } catch(e){} 
            }

            if (sanitized === "" || sanitized === "0" || sanitized === ".") {
                delete cartState[id];
            } else {
                cartState[id] = sanitized;
            }
            
            if (!safeStorageWrite('proDietCart', cartState)) {
                cartState = safeParse('proDietCart', {});
            }
            syncCartUI(); 
        }

        function calculateTotals() {
            let totalCents = 0;
            let categories = {};
            let count = Object.keys(cartState).length;

            DB.forEach(cat => {
                let catTotal = 0;
                if (cat.items) {
                    cat.items.forEach(item => {
                        let val = cartState[item.id];
                        let qty = parseFloat(val);
                        if (val && !isNaN(qty) && qty > 0) {
                            let pCent = item.priceCent || 0;
                            let pSize = item.packSize || 0;
                            if(item.unit === 'г' && pSize > 0) {
                                catTotal += Math.round(((qty / pSize) * pCent) + Number.EPSILON);
                            } else {
                                catTotal += Math.round((qty * pCent) + Number.EPSILON);
                            }
                        }
                    });
                }
                categories[cat.cat] = catTotal;
                totalCents += catTotal;
            });

            return { count, totalCents, categories };
        }

            const data = calculateTotals();

        function saveDbItem() {
            const targetCatIdx = document.getElementById('db-cat-select').value;
            const id = document.getElementById('db-item-id').value;
            const name = document.getElementById('db-item-name').value.trim();
            const priceRaw = document.getElementById('db-item-price').value.replace(',', '.');
            const price = parseFloat(priceRaw);
            const unit = document.getElementById('db-item-unit').value;
            const packSize = parseInt(document.getElementById('db-item-packsize').value);

            if(!name || isNaN(price) || price < 0) {
                showToast("Укажи имя и цену", "error");
                return false;
            }

            const priceCent = Math.round(price * 100);

            if(id) {
                let foundOldCatIdx = -1;
                let foundItemIdx = -1;
                let itemRef = null;
                
                for(let c=0; c<DB.length; c++) {
                    if (DB[c].items) {
                        foundItemIdx = DB[c].items.findIndex(i => i.id === id);
                        if(foundItemIdx !== -1) { foundOldCatIdx = c; itemRef = DB[c].items[foundItemIdx]; break; }
                    }
                }

                if(itemRef) {
                    itemRef.name = name;
                    itemRef.priceCent = priceCent;
                    itemRef.unit = unit;
                    if((unit === 'г' || unit === 'мл') && packSize > 0) itemRef.packSize = packSize;
                    else delete itemRef.packSize;

                    if(foundOldCatIdx !== -1 && foundOldCatIdx !== parseInt(targetCatIdx)) {
                        DB[foundOldCatIdx].items.splice(foundItemIdx, 1);
                        DB[targetCatIdx].items.push(itemRef);
                    }
                }
            } else {
                const newItem = {
                    id: 'item_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36),
                    name: name,
                    unit: unit,
                    priceCent: priceCent,
                    tags: [],
                    aliases: []
                };
                if((unit === 'г' || unit === 'мл') && packSize > 0) newItem.packSize = packSize;
                if (!DB[targetCatIdx].items) DB[targetCatIdx].items = [];
                DB[targetCatIdx].items.push(newItem);
            }

            safeStorageWrite('proDietDB', DB);
            buildItemMap();
            renderMatrix();
            buildSidebar();
            updateUI();
            
            document.getElementById('db-cat-select').value = targetCatIdx;
            renderDbItems();
            resetDbForm();
            showToast("Успешно сохранено", "success");
            if(document.activeElement) document.activeElement.blur();
            return true;
        }

        function deleteDbItem(catIdx, itemIdx) {
            const item = DB[catIdx].items[itemIdx];
            if(confirm(`Точно удалить "${item.name}" из базы?`)) {
                
                if(cartState[item.id]) {
                    delete cartState[item.id];
                    safeStorageWrite('proDietCart', cartState);
                }

                let combosChanged = false;
                customCombos.forEach(combo => {
                    const originalLength = combo.ids.length;
                    combo.ids = combo.ids.filter(comboId => comboId !== item.id);
                    if (originalLength !== combo.ids.length) combosChanged = true;
                });
                if (combosChanged) safeStorageWrite('proDietCombos', customCombos);

                DB[catIdx].items.splice(itemIdx, 1);
                safeStorageWrite('proDietDB', DB);
                
                buildItemMap();
                renderMatrix();
                buildSidebar();
                updateUI();
                renderDbItems();
                showToast("Товар удален", "info");
            }
        }

        function importDbJson(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                if(document.activeElement) document.activeElement.blur();
                try {
                    const importedDB = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(importedDB)) throw new Error("Not an array");
                    
                    const isValid = importedDB.every(cat => 
                        typeof cat.cat === 'string' && 
                        Array.isArray(cat.items) && 
                        cat.items.every(item => 
                            item && 
                            typeof item.id === 'string' && 
                            typeof item.name === 'string' && 
                            typeof item.priceCent === 'number' &&
                            !Number.isNaN(item.priceCent) &&
                            (item.packSize === undefined || (typeof item.packSize === 'number' && !Number.isNaN(item.packSize)))
                        )
                    );
                    
                    if (!isValid) throw new Error("Invalid structure");

                    const backupDB = JSON.parse(JSON.stringify(DB));
                    DB = importedDB;
                    
                    try {
                        localStorage.setItem('proDietDB', JSON.stringify(DB));
                    } catch (storageError) {
                        DB = backupDB; 
                        throw new Error("QUOTA_EXCEEDED");
                    }

                    buildItemMap();
                    sanitizeCart();
                    sanitizeCombos();
                    renderCombos();
                    renderMatrix();
                    buildSidebar();
                    updateUI();
                    
                    if (document.getElementById('db-modal').classList.contains('active')) {
                        openDbManager(); 
                    }
                    
                    showToast("База успешно загружена!", "success");
                } catch (err) {
                    if (err.message === "QUOTA_EXCEEDED") {
                        showToast("Файл слишком большой для памяти!", "error");
                    } else {
                        showToast("Ошибка: Неверный формат файла", "error");
                    }
                }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function generateMessageTexts() {
            let messages = [];
            let currentMessage = "🛒 <b>СПИСОК ПОКУПОК</b>\n\n";
            let hasItems = false;
            let data = calculateTotals();

            DB.forEach(category => {
                let catSum = data.categories[category.cat] || 0;
                let sumText = catSum > 0 ? ` [${(catSum / 100).toFixed(2)} €]` : "";
                let categoryHeader = `<b>${escapeHtml(category.icon)} ${escapeHtml(category.cat)}${sumText}</b>\n`;
                let catHasItems = false;
                let isHeaderPrinted = false;

                if (category.items) {
                    category.items.forEach(item => {
                        let val = cartState[item.id];
                        let qty = parseFloat(val);
                        if (val && !isNaN(qty) && qty > 0) {
                            let finalQty = qty;
                            let finalUnit = item.unit || 'шт';
                            if(finalUnit === 'г' && finalQty >= 1000) { finalQty = finalQty / 1000; finalUnit = 'кг'; }
                            
                            let line = `▫️ ${escapeHtml(item.name)}: ${finalQty} ${escapeHtml(finalUnit)}\n`;
                            hasItems = true;
                            catHasItems = true;

                            let headerToPrint = isHeaderPrinted ? "" : categoryHeader;
                            
                            if (currentMessage.length + headerToPrint.length + line.length > 3500) {
                                if (currentMessage.trim() !== "") messages.push(currentMessage);
                                currentMessage = "🛒 <b>ПРОДОЛЖЕНИЕ СПИСКА</b>\n\n";
                                isHeaderPrinted = false;
                                headerToPrint = `<b>${escapeHtml(category.icon)} ${escapeHtml(category.cat)} (продолж.)</b>\n`;
                            }
                            
                            currentMessage += headerToPrint + line;
                            isHeaderPrinted = true;
                        }
                    });
                }
                if (catHasItems) currentMessage += "\n";
            });
            
            if(hasItems) {
                let totalBlock = `💶 <b>ИТОГО: ${(data.totalCents / 100).toFixed(2)} €</b>`;
                if (currentMessage.length + totalBlock.length > 3900) {
                    messages.push(currentMessage);
                    currentMessage = totalBlock;
                } else {
                    currentMessage += totalBlock;
                }
                messages.push(currentMessage);
                return messages;
            }
            
            return null;
        }

        async function shareCart() {
            doVibrate(20);
            let messages = generateMessageTexts();
            if (!messages || messages.length === 0) return showToast("Список пуст", "error");

            let fullHtml = messages.join('\n\n--- ✂️ ---\n\n');
            let plainText = convertHtmlToPlain(fullHtml);
            let shared = false;
            
            if (navigator.share) {
                try {
                    await navigator.share({ title: 'Список покупок Pro-Diet', text: plainText });
                    shared = true;
                } catch (err) { 
                    if (err.name === 'AbortError') return; 
                }
            } 
            
            if (!shared && navigator.clipboard) {
                try {
                    await navigator.clipboard.writeText(plainText);
                    showToast("Текст скопирован в буфер!", "info");
                } catch (e) {
                    showToast("Ошибка. Копирование недоступно.", "error");
                }
            } else if (!shared) {
                showToast("Ваш браузер не поддерживает шаринг", "error");
            }
        }

        // КЛАССИЧЕСКАЯ ОТПРАВКА КАК В ПЕРВОЙ ВЕРСИИ
        async function generateAndSend() {
            if(isSending) return;
            doVibrate(30);

            let token = (localStorage.getItem('tg_token') || '').replace(/[\s"']/g, '');
            let chatId = (localStorage.getItem('tg_chat_id') || '').replace(/[\s"']/g, '');

            const btn = document.getElementById('btn-send');
            const label = document.getElementById('btn-label');

            if (!token || !chatId) {
                showToast("Укажи Token и Chat ID ⚙️", "error");
                toggleSettings();
                return;
            }

            let messages = generateMessageTexts();
            if (!messages || messages.length === 0) return showToast("Список пуст!", "error");

            isSending = true;
            btn.classList.add('loading');
            label.innerText = "⏳...";

            let allSuccess = true;
            let offlineTriggered = false;

            for (let msg of messages) {
                const payload = { chat_id: chatId, text: msg, parse_mode: 'HTML' };
                const apiUrl = `https://api.telegram.org/bot${token}/sendMessage`;

                try {
                    // Обычный рабочий fetch
                    let response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    let result = await response.json();
                    if (!result.ok) {
                        // ОШИБКА API (Неправильный токен, не тот чат и тд) -> В ОЧЕРЕДЬ НЕ КЛАДЁМ!
                        showToast("Ошибка API: " + (result.description || "Неизвестно"), "error");
                        allSuccess = false;
                        break; // Тормозим отправку остальных кусков
                    }
                } catch (error) {
                    // РЕАЛЬНЫЙ СБОЙ СЕТИ -> Кладём в очередь
                    queueRequest(token, payload);
                    offlineTriggered = true;
                    allSuccess = false;
                }
            }

            // Очищаем корзину только если отправили или если упало в оффлайн-очередь
            // Если была ошибка API (типа 404), корзина не чистится!
            if (offlineTriggered || allSuccess) {
                wipeCartAfterSend();
            }

            if (offlineTriggered) {
                label.innerText = "💾 В очереди";
                showToast("Сбой сети. Сохранено в очередь.", "info");
            } else if (allSuccess) {
                label.innerText = "✅ Отправлено";
                btn.style.background = "#2ea043";
                showToast("Успешно отправлено!", "success");
                if(typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 }, colors: ['#39d353', '#58a6ff', '#ffffff']});
                }
            } else {
                label.innerText = "❌ Ошибка";
                btn.style.background = "var(--danger)";
            }

            cleanupAfterSend(btn);
        }

        function queueRequest(token, payload) {
            let latestQueue = safeParse('proDietQueue', []);
            const reqId = Date.now().toString(36) + Math.random().toString(36).substr(2);
            latestQueue.push({ id: reqId, token, payload });
            
            if (latestQueue.length > 30) {
                latestQueue.shift(); 
                showToast("Лимит очереди! Старый чек удален.", "error");
            }
            offlineQueue = latestQueue;
            safeStorageWrite('proDietQueue', offlineQueue);
        }

        function cleanupAfterSend(btn) {
            setTimeout(() => {
                btn.classList.remove('loading');
                btn.style.background = "var(--success)";
                isSending = false;
                updateUI();
            }, 2500);
        }

        async function flushOfflineQueue() {
            if(offlineQueue.length === 0 || isFlushingQueue) return;
            
            isFlushingQueue = true;
            showToast("Отправка очереди...", "info");
            
            let successfulIds = [];
            let unrecoverableIds = []; 
            
            for (let req of offlineQueue) {
                if (!req || !req.token || !req.payload) {
                    if (req && req.id) unrecoverableIds.push(req.id);
                    continue;
                }

                try {
                    const cleanToken = req.token.replace(/[\s"']/g, '');
                    const apiUrl = `https://api.telegram.org/bot${cleanToken}/sendMessage`;
                    
                    let bodyData = typeof req.payload === 'string' ? req.payload : JSON.stringify(req.payload);

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }, // Только JSON
                        body: bodyData
                    });
                    
                    if (res.ok) {
                        successfulIds.push(req.id);
                    } else {
                        // Телеграм ответил, но с ошибкой. Значит токен битый. Сносим из очереди.
                        unrecoverableIds.push(req.id);
                    }
                } catch (e) {
                    // Опять нет сети, оставляем в очереди
                }
            }
            
            let latestQueue = safeParse('proDietQueue', []);
            offlineQueue = latestQueue.filter(req => !successfulIds.includes(req.id) && !unrecoverableIds.includes(req.id));
            safeStorageWrite('proDietQueue', offlineQueue);
            
            if(offlineQueue.length === 0) {
                if (unrecoverableIds.length > 0 && successfulIds.length === 0) {
                    showToast("Очередь удалена (Ошибки API)", "error");
                } else {
                    showToast("Очередь успешно отправлена!", "success");
                    if(typeof confetti === 'function') confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 }});
                }
            } else if (successfulIds.length > 0) {
                showToast("Часть очереди отправлена", "info");
            } else {
                showToast("Сеть недоступна, чеки в очереди", "error");
            }
            isFlushingQueue = false;
        }

    </script>
</body>
