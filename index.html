<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Теги для превращения в Мобильное Приложение (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pro-Diet OS">
    <meta name="theme-color" content="#0d1117">
    
    <title>Pro-Diet OS | Складская Логистика</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #39d353;
            --danger: #f85149;
            --border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); padding-bottom: 110px; }
        
        header { background: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        h1 { font-size: 18px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin: 0; }
        .settings-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.3s; padding: 0 5px; }
        .settings-btn:hover { color: var(--accent); }
        
        /* Фильтр: Скрытие нормальных позиций в режиме магазина */
        body.filter-active .item-row:not(.is-low) { display: none; }
        body.filter-active #filter-btn { color: var(--success); text-shadow: 0 0 10px rgba(57, 211, 83, 0.4); }
        
        .container { padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
        
        .category-group { margin-bottom: 25px; }
        .category-title { font-size: 14px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .category-items { transition: max-height 0.3s ease-out; overflow: hidden; }
        .category-items.hidden { display: none; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--border); transition: 0.2s; cursor: pointer; }
        .item-info { display: flex; flex-direction: column; pointer-events: none; }
        .item-name { font-size: 15px; font-weight: 500; transition: 0.2s; }
        .item-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        
        /* Подсветка дефицитных товаров */
        .item-row.is-low { border-color: rgba(248, 81, 73, 0.4); background: rgba(248, 81, 73, 0.08); }
        .item-row.is-low .item-name { color: var(--danger); }

        /* Чек-лист в магазине (Вычеркнутые товары) */
        .item-row.checked { border-color: var(--success); background: rgba(57, 211, 83, 0.08); opacity: 0.6; }
        .item-row.checked .item-name { text-decoration: line-through; color: var(--success); }
        
        .item-input-wrapper { display: flex; align-items: center; gap: 8px; }
        input[type="number"], input[type="text"] { background: var(--bg); border: 1px solid var(--border); color: var(--accent); font-weight: bold; padding: 8px; border-radius: 6px; width: 70px; text-align: center; font-size: 16px; transition: 0.2s; }
        input[type="text"] { font-weight: normal; color: var(--text); }
        input[type="number"]:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
        .unit { font-size: 12px; color: var(--text-muted); width: 25px;}

        .floating-action { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; z-index: 100; }
        
        .btn-primary { background: var(--success); color: var(--bg); border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(57, 211, 83, 0.2); transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary:active { transform: scale(0.96); }
        
        .btn-secondary { background: var(--surface-hover); color: var(--accent); border: 1px solid var(--border); padding: 14px; width: 100%; border-radius: 12px; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-bottom: 20px; transition: 0.3s ease; }
        .btn-secondary:active { transform: scale(0.98); }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--surface); padding: 25px; border-radius: 12px; border: 1px solid var(--border); width: 90%; max-width: 400px; }
        .modal-content h2 { margin-bottom: 15px; font-size: 18px; color: var(--accent); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input { width: 100%; text-align: left; }
        .btn-save { background: var(--accent); color: var(--bg); border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        .close-modal { text-align: right; color: var(--text-muted); cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Pro-Diet OS</h1>
        <div>
            <button class="settings-btn" id="filter-btn" onclick="toggleFilter()" title="Режим Магазина (Только дефицит)">🛒</button>
            <button class="settings-btn" onclick="toggleSettings()" title="Настройки API">⚙️</button>
        </div>
    </header>

    <div class="container">
        <!-- Основная Матрица -->
        <div id="matrix-container"></div>
        
        <!-- Блок разовых покупок -->
        <div class="category-group">
            <div class="category-title" style="cursor: default; user-select: none;">
                <span>📌 Разовые покупки</span>
            </div>
            <div class="item-input-wrapper" style="width: 100%; margin-bottom: 10px; display: flex; gap: 10px;">
                <input type="text" id="adhoc-input" placeholder="Например: Лампочка E27" style="flex: 1;" onkeydown="if(event.key==='Enter') addAdhoc()">
                <button class="btn-primary" style="padding: 10px 15px; font-size: 20px; box-shadow: none;" onclick="addAdhoc()">+</button>
            </div>
            <div id="adhoc-list"></div>
        </div>

        <!-- Восполнение склада -->
        <button class="btn-secondary" id="btn-fill" onclick="fillStock()">
            📦 Закупка завершена (Восполнить склад)
        </button>
    </div>

    <!-- Плавающая панель управления -->
    <div class="floating-action">
        <div style="display: flex; gap: 10px;">
            <button class="btn-primary" id="btn-copy" onclick="copyList()" style="background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); box-shadow: none; flex: 1;">
                📋 Копия
            </button>
            <button class="btn-primary" id="btn-send" onclick="generateAndSend()" style="flex: 2;">
                🚀 В Telegram
            </button>
        </div>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="close-modal" onclick="toggleSettings()">✕ Закрыть</div>
            <h2>Настройки Telegram API</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">Данные сохраняются только в телефоне.</p>
            <div class="form-group">
                <label>Bot Token (@BotFather)</label>
                <input type="text" id="tg-token" placeholder="123456:ABC-DEF1234ghIkl">
            </div>
            <div class="form-group">
                <label>Ваш Chat ID (@userinfobot)</label>
                <input type="text" id="tg-chat-id" placeholder="123456789">
            </div>
            <button class="btn-save" onclick="saveSettings()">Сохранить Конфигурацию</button>
        </div>
    </div>

    <script>
        const DB = [
            { cat: "1. Фреш-Зона", icon: "🥬", items: [
                { id: "bananas", name: "Бананы", min: 0, opt: 14, unit: "шт", price: 0.30 },
                { id: "tomatoes", name: "Помидоры", min: 0, opt: 7, unit: "шт", price: 0.40 }
            ]},
            { cat: "2. Бакалея", icon: "🌾", items: [
                { id: "oats", name: "Овсянка", min: 1, opt: 3, unit: "уп", price: 0.80 },
                { id: "chia", name: "Семена Чиа", min: 1, opt: 3, unit: "уп", price: 1.50 },
                { id: "rice", name: "Рис Басмати", min: 500, opt: 1500, unit: "г", price: 0.003 }, 
                { id: "pasta", name: "Спагетти", min: 500, opt: 1500, unit: "г", price: 0.002 },
                { id: "buckwheat", name: "Гречка", min: 500, opt: 1500, unit: "г", price: 0.003 },
                { id: "bread", name: "Протеиновый хлеб", min: 0, opt: 1, unit: "уп", price: 2.00 },
                { id: "nuts", name: "Орехи (Грецкие)", min: 100, opt: 500, unit: "г", price: 0.015 },
                { id: "oil", name: "Масло растит.", min: 100, opt: 500, unit: "мл", price: 0.004 },
                { id: "cacao", name: "Какао", min: 100, opt: 600, unit: "г", price: 0.008 }
            ]},
            { cat: "3. Сыры, Ягоды, Снеки", icon: "🧀", items: [
                { id: "honey", name: "Мёд", min: 100, opt: 1000, unit: "г", price: 0.006 },
                { id: "white_cheese", name: "Белый сыр", min: 200, opt: 1000, unit: "г", price: 0.008 },
                { id: "kashar", name: "Сыр Кашар", min: 250, opt: 750, unit: "г", price: 0.01 },
                { id: "gouda", name: "Сыр Гауда", min: 0, opt: 2, unit: "уп", price: 2.20 },
                { id: "cottage", name: "Творожный сыр", min: 1, opt: 3, unit: "уп", price: 1.50 },
                { id: "olives", name: "Оливки", min: 1, opt: 3, unit: "уп", price: 1.20 },
                { id: "blueberry", name: "Черника", min: 100, opt: 750, unit: "г", price: 0.012 },
                { id: "raspberry", name: "Малина", min: 100, opt: 750, unit: "г", price: 0.014 },
                { id: "chips", name: "Чипсы", min: 3, opt: 12, unit: "уп", price: 1.80 }
            ]},
            { cat: "4. Мясной отдел", icon: "🥩", items: [
                { id: "chicken", name: "Филе курицы", min: 0.7, opt: 3.0, unit: "кг", price: 10.00 }, 
                { id: "fuet", name: "Салями Fuet", min: 1, opt: 5, unit: "шт", price: 2.50 }
            ]},
            { cat: "5. Молочная база", icon: "🥛", items: [
                { id: "milk", name: "Молоко 1.5%", min: 7, opt: 24, unit: "уп", price: 1.05 },
                { id: "eggs", name: "Яйца", min: 10, opt: 30, unit: "шт", price: 0.20 },
                { id: "butter", name: "Сливочное масло", min: 1, opt: 5, unit: "уп", price: 2.00 }
            ]},
            { cat: "6. Инфраструктура & Зоопарк", icon: "🧻", items: [
                { id: "rat_food", name: "Корм для крыс", min: 1, opt: 4, unit: "уп", price: 4.00 },
                { id: "tp", name: "Туалетная бумага", min: 5, opt: 30, unit: "рул", price: 0.40 },
                { id: "towels", name: "Бум. полотенца", min: 2, opt: 8, unit: "рул", price: 0.60 }
            ]},
            { cat: "7. Напитки и Спортпит", icon: "🍺", items: [
                { id: "juice", name: "Сок", min: 7, opt: 24, unit: "шт", price: 1.20 },
                { id: "beer", name: "Пиво", min: 7, opt: 40, unit: "шт", price: 0.80 },
                { id: "protein", name: "Протеин", min: 1, opt: 5, unit: "уп", price: 15.00 }
            ]}
        ];

        let adhocItems = JSON.parse(localStorage.getItem('proDietAdhoc')) || [];

        window.onload = function() {
            renderMatrix();
            renderAdhoc();
            loadSettings();
        };

        function toggleFilter() {
            document.body.classList.toggle('filter-active');
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderMatrix() {
            const container = document.getElementById('matrix-container');
            const savedData = JSON.parse(localStorage.getItem('proDietStock')) || {};
            const checkedData = JSON.parse(localStorage.getItem('proDietChecked')) || [];
            let fullHtml = ''; 

            DB.forEach(category => {
                fullHtml += `
                    <div class="category-group">
                        <div class="category-title" onclick="this.nextElementSibling.classList.toggle('hidden')">
                            <span>${category.icon} ${category.cat}</span>
                            <span style="font-size: 14px; color: var(--text-muted);">↕️</span>
                        </div>
                        <div class="category-items">
                `;
                
                category.items.forEach(item => {
                    let val = savedData[item.id] !== undefined ? savedData[item.id] : '';
                    let stock = parseFloat(val) || 0;
                    let isLow = stock <= item.min ? 'is-low' : ''; 
                    let isChecked = (checkedData.includes(item.id) && isLow) ? 'checked' : '';

                    fullHtml += `
                        <div class="item-row ${isLow} ${isChecked}" id="row-${item.id}" onclick="toggleCheck('${item.id}', event)">
                            <div class="item-info">
                                <span class="item-name">${item.name}</span>
                                <span class="item-meta">Квант закупки: ${item.opt} ${item.unit} | Мин: ${item.min}</span>
                            </div>
                            <div class="item-input-wrapper">
                                <input type="number" 
                                       inputmode="decimal"
                                       step="any"
                                       min="0"
                                       id="qty-${item.id}" 
                                       value="${val}" 
                                       placeholder="0" 
                                       onfocus="this.select()"
                                       oninput="saveStock('${item.id}')">
                                <span class="unit">${item.unit}</span>
                            </div>
                        </div>
                    `;
                });
                
                fullHtml += `</div></div>`;
            });

            container.innerHTML = fullHtml;
        }

        function toggleCheck(id, event) {
            if(event.target.tagName === 'INPUT') return;
            
            const row = document.getElementById('row-' + id);
            if(row && row.classList.contains('is-low')) {
                row.classList.toggle('checked');
                
                let checkedData = JSON.parse(localStorage.getItem('proDietChecked')) || [];
                if (row.classList.contains('checked')) {
                    if (!checkedData.includes(id)) checkedData.push(id);
                } else {
                    checkedData = checkedData.filter(i => i !== id);
                }
                localStorage.setItem('proDietChecked', JSON.stringify(checkedData));
            }
        }

        function saveStock(id) {
            let input = document.getElementById('qty-' + id);
            if (input.value !== "" && parseFloat(input.value) < 0) input.value = 0;
            
            let val = input.value;
            let data = JSON.parse(localStorage.getItem('proDietStock')) || {};
            data[id] = val;
            localStorage.setItem('proDietStock', JSON.stringify(data));

            let itemMeta = null;
            DB.forEach(c => c.items.forEach(i => { if(i.id === id) itemMeta = i; }));

            if (itemMeta) {
                let stock = parseFloat(val) || 0;
                let row = document.getElementById('row-' + id);
                if (row) {
                    if (stock <= itemMeta.min) {
                        row.classList.add('is-low');
                    } else {
                        row.classList.remove('is-low');
                        row.classList.remove('checked');
                        
                        let checkedData = JSON.parse(localStorage.getItem('proDietChecked')) || [];
                        checkedData = checkedData.filter(i => i !== id);
                        localStorage.setItem('proDietChecked', JSON.stringify(checkedData));
                    }
                }
            }
        }

        function addAdhoc() {
            const input = document.getElementById('adhoc-input');
            const val = input.value.trim();
            if(val) {
                adhocItems.push(val);
                localStorage.setItem('proDietAdhoc', JSON.stringify(adhocItems));
                input.value = '';
                renderAdhoc();
            }
        }
        
        function removeAdhoc(idx) {
            adhocItems.splice(idx, 1);
            localStorage.setItem('proDietAdhoc', JSON.stringify(adhocItems));
            renderAdhoc();
        }
        
        function clearAdhoc() {
            adhocItems = [];
            localStorage.removeItem('proDietAdhoc');
            renderAdhoc();
        }
        
        function renderAdhoc() {
            const container = document.getElementById('adhoc-list');
            container.innerHTML = adhocItems.map((item, idx) => `
                <div class="item-row" style="padding: 10px 15px; background: var(--surface-hover);">
                    <span style="font-size: 14px;">${escapeHtml(item)}</span>
                    <span style="cursor: pointer; color: var(--danger); font-size: 16px; padding: 0 10px;" onclick="removeAdhoc(${idx})">✕</span>
                </div>
            `).join('');
        }

        // УМНОЕ ВОСПОЛНЕНИЕ СКЛАДА
        function fillStock() {
            let data = JSON.parse(localStorage.getItem('proDietStock')) || {};
            let checkedData = JSON.parse(localStorage.getItem('proDietChecked')) || [];
            
            // Находим все дефицитные позиции
            let lowItems = [];
            DB.forEach(c => c.items.forEach(i => {
                let stock = parseFloat(data[i.id]) || 0;
                if (stock <= i.min) lowItems.push(i);
            }));

            if (lowItems.length === 0) {
                alert("Дефицитных товаров нет, склад полон!");
                return;
            }

            let itemsToReplenish = [];
            
            // Если что-то вычеркнуто — восполняем ТОЛЬКО вычеркнутые. 
            // Если НИЧЕГО не вычеркнуто — восполняем ВСЕ дефицитные.
            if (checkedData.length > 0) {
                itemsToReplenish = lowItems.filter(i => checkedData.includes(i.id));
            } else {
                itemsToReplenish = lowItems;
            }

            let confirmMsg = checkedData.length > 0 
                ? `Восполнить ${itemsToReplenish.length} отмеченных товаров?` 
                : `Восполнить ВСЕ дефицитные товары (${itemsToReplenish.length} шт.) до целевых норм?`;

            if (!confirm(confirmMsg)) return;
            
            itemsToReplenish.forEach(item => {
                let currentStock = parseFloat(data[item.id]) || 0;
                data[item.id] = currentStock + item.opt; 
            });
            
            localStorage.setItem('proDietStock', JSON.stringify(data));
            localStorage.removeItem('proDietChecked');
            renderMatrix();
            
            const btn = document.getElementById('btn-fill');
            const originalText = btn.innerHTML;
            btn.innerHTML = "✅ ГОМЕОСТАЗ ВОССТАНОВЛЕН";
            btn.style.background = "var(--success)";
            btn.style.color = "var(--bg)";
            btn.style.borderColor = "var(--success)";
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = "";
                btn.style.color = "";
                btn.style.borderColor = "";
            }, 2500);
        }

        function buildMessage(format = 'html') {
            let message = format === 'html' ? "🛒 <b>МАТРИЦА ЗАКУПКИ</b>\n\n" : "🛒 *МАТРИЦА ЗАКУПКИ*\n\n";
            let totalPrice = 0;
            let hasItems = false;

            DB.forEach(category => {
                let catText = "";
                category.items.forEach(item => {
                    let stock = parseFloat(document.getElementById('qty-' + item.id).value) || 0;
                    if (stock <= item.min) {
                        let toBuy = item.opt; 
                        let itemName = format === 'html' ? escapeHtml(item.name) : item.name;
                        let itemFmt = format === 'html' ? `<b>${toBuy} ${item.unit}</b>` : `*${toBuy} ${item.unit}*`;
                        
                        catText += `▫️ ${itemName}: ${itemFmt}\n`;
                        totalPrice += (toBuy * item.price);
                        hasItems = true;
                    }
                });
                
                if (catText !== "") {
                    let catName = format === 'html' ? escapeHtml(category.cat) : category.cat;
                    let catHeader = format === 'html' ? `<b>${category.icon} ${catName}</b>` : `*${category.icon} ${catName}*`;
                    message += `${catHeader}\n${catText}\n`;
                }
            });

            if (adhocItems.length > 0) {
                let adhocHeader = format === 'html' ? `<b>📌 Разовые покупки</b>` : `*📌 Разовые покупки*`;
                message += `${adhocHeader}\n`;
                adhocItems.forEach(i => {
                    let itemName = format === 'html' ? escapeHtml(i) : i;
                    message += `▫️ ${itemName}\n`;
                });
                message += `\n`;
                hasItems = true;
            }

            if (!hasItems) return null;

            let budgetHeader = format === 'html' ? `<b>Бюджет: ~ ${totalPrice.toFixed(2)} EUR</b>` : `*Бюджет: ~ ${totalPrice.toFixed(2)} EUR*`;
            message += `💰 ${budgetHeader}`;
            
            return message;
        }

        async function copyList() {
            const msg = buildMessage('text');
            if (!msg) {
                alert("Склад полон! Список пуст.");
                return;
            }
            
            const btn = document.getElementById('btn-copy');
            try {
                await navigator.clipboard.writeText(msg);
                btn.innerHTML = "✅ Скопировано!";
                btn.style.background = "var(--success)";
                btn.style.color = "var(--bg)";
                clearAdhoc();
            } catch (err) {
                alert("Ошибка буфера обмена.");
            }
            
            setTimeout(() => {
                btn.innerHTML = "📋 Копия";
                btn.style.background = "var(--surface-hover)";
                btn.style.color = "var(--text)";
            }, 2000);
        }

        async function generateAndSend() {
            const token = localStorage.getItem('tg_token');
            const chatId = localStorage.getItem('tg_chat_id');
            const btn = document.getElementById('btn-send');

            if (!token || !chatId) {
                alert("Ошибка: Укажите Token и Chat ID в настройках ⚙️");
                toggleSettings();
                return;
            }

            const msg = buildMessage('html');
            if (!msg) {
                alert("Склад полон! Закупка не требуется.");
                return;
            }

            btn.innerHTML = "⏳ Отправка...";
            btn.style.opacity = "0.7";

            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: msg,
                        parse_mode: 'HTML'
                    })
                });
                
                const result = await response.json();
                if (result.ok) {
                    btn.innerHTML = "✅ Отправлено!";
                    btn.style.background = "#2ea043";
                    clearAdhoc();
                } else {
                    alert("Ошибка API: " + result.description);
                    btn.innerHTML = "❌ Ошибка";
                    btn.style.background = "var(--danger)";
                }
            } catch (error) {
                alert("Ошибка сети. Проверьте интернет.");
                btn.innerHTML = "❌ Ошибка Сети";
                btn.style.background = "var(--danger)";
            }

            setTimeout(() => {
                btn.innerHTML = "🚀 В Telegram";
                btn.style.background = "var(--success)";
                btn.style.opacity = "1";
            }, 3000);
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('active');
        }
        function loadSettings() {
            document.getElementById('tg-token').value = localStorage.getItem('tg_token') || '';
            document.getElementById('tg-chat-id').value = localStorage.getItem('tg_chat_id') || '';
        }
        function saveSettings() {
            localStorage.setItem('tg_token', document.getElementById('tg-token').value.trim());
            localStorage.setItem('tg_chat_id', document.getElementById('tg-chat-id').value.trim());
            toggleSettings();
            alert("Конфигурация Telegram сохранена!");
        }
    </script>
</body>
</html>
